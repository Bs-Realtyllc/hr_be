# =============================================================================
# RETIRED — this file is no longer used.
#
# Frontend and backend run on the same VPS and share one public domain
# (hr.gitgi.com), so they must be served by a SINGLE nginx server block that
# splits traffic by path (/api/* → backend, everything else → frontend).
# Two separate files each declaring `server_name hr.gitgi.com` cannot both be
# active at once — only one wins, which is why /api/* traffic was not
# reliably reaching this backend.
#
# The merged, authoritative config now lives at ../frontend/nginx.conf.
# Install that single file on the server (e.g. as
# /etc/nginx/sites-available/hr.gitgi.com) and remove any config that still
# references this file or the old hr.bsrealtyllc.com domain.
# =============================================================================

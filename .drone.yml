---
kind:     pipeline
type:     docker
name:     hr-be-api

trigger:
  branch:
    - dev
    - main
  event:
    - push

clone:
  depth: 1

steps:

  # ── dev branch: build & push ghcr.io/bs-realtyllc/hr_be:dev-* ──────────────
  - name: build-and-push-dev
    image: plugins/docker
    settings:
      registry: ghcr.io
      repo: ghcr.io/bs-realtyllc/hr_be
      tags:
        - dev-latest
        - "dev-${DRONE_COMMIT_SHA:0:8}"
      dockerfile: Dockerfile
      context:    .
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token
      cache_from: ghcr.io/bs-realtyllc/hr_be:dev-latest
    when:
      branch:
        - dev

  # ── main branch: build & push ghcr.io/bs-realtyllc/hr_be:latest ────────────
  - name: build-and-push-main
    image: plugins/docker
    settings:
      registry: ghcr.io
      repo: ghcr.io/bs-realtyllc/hr_be
      tags:
        - latest
        - "${DRONE_COMMIT_SHA:0:8}"
      dockerfile: Dockerfile
      context:    .
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token
      cache_from: ghcr.io/bs-realtyllc/hr_be:latest
    when:
      branch:
        - main

  - name: copy-configs-dev
    image: appleboy/drone-scp
    settings:
      host:
        from_secret: ssh_host
      username:
        from_secret: ssh_user
      key:
        from_secret: ssh_private_key
      target: /opt/hr-be-dev/backend
      source:
        - docker-compose.dev.yml
    when:
      branch:
        - dev
    depends_on:
      - build-and-push-dev

  - name: copy-configs-main
    image: appleboy/drone-scp
    settings:
      host:
        from_secret: ssh_host
      username:
        from_secret: ssh_user
      key:
        from_secret: ssh_private_key
      target: /opt/hr-be/backend
      source:
        - docker-compose.main.yml
    when:
      branch:
        - main
    depends_on:
      - build-and-push-main

  # ── deploy: branch picks the compose file, target dir, and container name ──
  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: ssh_host
      username:
        from_secret: ssh_user
      key:
        from_secret: ssh_private_key
      envs:
        - DRONE_COMMIT_BRANCH
      script:
        - |
          if [ "$DRONE_COMMIT_BRANCH" = "main" ]; then
            DIR=/opt/hr-be/backend
            FILE=docker-compose.main.yml
            CONTAINER=hr-be-backend
          else
            DIR=/opt/hr-be-dev/backend
            FILE=docker-compose.dev.yml
            CONTAINER=hr-be-dev-backend
          fi
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          cd $DIR
          docker compose -f $FILE pull app
          docker compose -f $FILE up -d --remove-orphans
          docker image prune -f
          docker ps | grep $CONTAINER
      environment:
        GHCR_USERNAME:
          from_secret: ghcr_username
        GHCR_TOKEN:
          from_secret: ghcr_token
    depends_on:
      - copy-configs-dev
      - copy-configs-main

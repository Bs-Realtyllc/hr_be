# =============================================================================
# nginx.conf — reverse proxy for hr-platform-backend (Express)
#
# No Docker — PM2 runs the Express app directly on the VPS.
#
#   Internet (443)
#       → nginx (SSL termination via Certbot)
#           → Express app (localhost:6002, bound to loopback only)
#
# Deploy path  : /var/www/hr-platform/backend
# PM2 app name : hr-backend
# =============================================================================

upstream backend {
    server localhost:6002;
    keepalive 64;
}

# =============================================================================
server {
    listen 80;

    server_name hr.bsrealtyllc.com;

    # ── Request size ──────────────────────────────────────────────────────────
    # Raise if you later add file/avatar upload endpoints.
    client_max_body_size 10m;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                          always;
    add_header X-Frame-Options         "DENY"                             always;
    add_header X-XSS-Protection        "1; mode=block"                    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;

    # ── Health check ──────────────────────────────────────────────────────────
    # Suppress access logs so monitoring pings don't pollute the log stream.
    location = /api/health {
        access_log off;
        proxy_pass        http://backend;
        proxy_set_header  Host       $host;
        proxy_set_header  X-Real-IP  $remote_addr;
    }

    # ── Swagger UI ────────────────────────────────────────────────────────────
    # The UI loads several JS/CSS bundles on first open; give it extra time.
    # In production you may want to restrict this path to VPN/internal IPs only.
    location /api/swagger/ {
        proxy_pass            http://backend;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;

        proxy_read_timeout    60s;
        proxy_connect_timeout 30s;
    }

    # ── All API routes ────────────────────────────────────────────────────────
    location / {
        proxy_pass            http://backend;
        proxy_http_version    1.1;

        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;

        # Allow slow DB queries (e.g. heavy reports) and future file uploads.
        proxy_read_timeout    300s;
        proxy_connect_timeout  75s;
        proxy_send_timeout    300s;
    }
}

# =============================================================================
# docker-compose.dev.yml — DEV SERVER DEPLOYMENT
#
# Deployed by Drone to /opt/hr-be-dev/backend on push to `dev`.
# Pulls ghcr.io/bs-realtyllc/hr_be:dev and connects to the shared host MySQL
# (same instance as prod, separate `hr_platform_dev` database + scoped user).
# =============================================================================

name: hr-be-dev

services:
  app:
    image: ghcr.io/bs-realtyllc/hr_be:dev
    container_name: hr-be-dev-backend
    restart: always
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DB_HOST: host.docker.internal
    ports:
      - "6003:6002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /opt/hr-be-dev/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hr-be-dev-net
      - proxy

networks:
  hr-be-dev-net:
    driver: bridge
  proxy:
    external: true
